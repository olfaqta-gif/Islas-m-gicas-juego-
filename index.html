<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Islas Mágicas">
<meta name="theme-color" content="#4FB8F0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Fabi, Cami y Vale</title>
<meta name="description" content="Aventuras de aprendizaje en la Isla Arcoíris">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  --ink:#3B2A66;--ink2:#6E5E96;--paper:#FFFDF8;
  --grape:#8E5CD9;--grape-d:#6C3FB5;--berry:#FF6FA5;--berry-d:#E2487F;--sky:#4FB8F0;--sky-d:#2E93CF;
  --sun:#FFC93C;--sun-d:#F09A00;--leaf:#55C97A;--leaf-d:#2FA259;--tang:#FF9A3A;--tang-d:#E67512;--red:#FF5A65;
  --font:"Fredoka","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --s:1;--hs:1;color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#7CCBF5;color:var(--ink);font-family:var(--font);font-weight:600;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:.2em solid #fff;outline-offset:.15em}
#root{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;background:var(--bgTop,#7CCBF5)}
#root.rot{transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#root::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--bgBot,#7CCBF5);z-index:0}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;margin:-450px 0 0 -800px;transform:scale(var(--s));transform-origin:50% 50%;z-index:1}
#bg{position:absolute;left:-300px;top:-250px;width:2200px;height:1400px;pointer-events:none}
#bg svg{display:block;width:100%;height:100%}
#world{position:absolute;inset:0}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* sprites */
.sp{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.sp-in{position:absolute;transform-origin:50% 100%}
.sp-in>svg{display:block;width:100%;height:100%;overflow:visible}
.sp.tap{cursor:pointer}
.sp.tap .sp-in::before{content:"";position:absolute;inset:-12px}
.sp .shadow{position:absolute;left:50%;bottom:0;border-radius:50%;background:rgba(40,30,80,.18);transform:translate(-50%,50%)}
.sp.center .sp-in{transform-origin:50% 50%}
.pop>.sp-in{animation:popIn .55s cubic-bezier(.3,1.5,.5,1) backwards}
.bob>.sp-in{animation:bob 3.2s ease-in-out infinite;animation-delay:var(--ph,0s)}
.sway>.sp-in{animation:sway 3.6s ease-in-out infinite;animation-delay:var(--ph,0s)}
.wig>.sp-in{animation:wig .5s ease-in-out}
.pulse>.sp-in{animation:pulse 1.1s ease-in-out infinite}
.spin>.sp-in{animation:spin var(--dur,40s) linear infinite}
.drift{animation:drift var(--dur,60s) linear infinite;animation-delay:var(--ph,0s)}
.hint>.sp-in{animation:hintJump 1s ease-in-out infinite}
@keyframes popIn{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(var(--dx,2600px))}}
@keyframes hintJump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-16px) scale(1.04,.97)}60%{transform:translateY(0) scale(1.05,.95)}}

/* HUD: everything in em so it scales with the stage */
#hud{position:absolute;left:0;top:0;width:100%;height:100%;font-size:calc(var(--hs)*16px);pointer-events:none;z-index:8}
#hud>*{pointer-events:auto;position:absolute}
.rb{width:4.4em;height:4.4em;border-radius:50%;background:#fff;box-shadow:0 .38em 0 rgba(59,42,102,.22),0 .1em .5em rgba(59,42,102,.18);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.rb svg{width:2.5em;height:2.5em;display:block}
.rb:active{transform:translateY(.25em);box-shadow:0 .13em 0 rgba(59,42,102,.22)}
#btnBack{left:1.4em;top:1.2em}
#topRight{right:1.4em;top:1.2em;display:flex;gap:.8em;align-items:center}
#topRight>*{position:relative}
#starPill{height:4em;padding:0 1.3em 0 .5em;border-radius:2em;background:#fff;box-shadow:0 .38em 0 rgba(59,42,102,.22),0 .1em .5em rgba(59,42,102,.18);display:flex;align-items:center;gap:.4em}
#starPill .ic{width:3.2em;height:3.2em;display:block}
#starPill b{font-size:2.2em;font-weight:700;min-width:1.1em;text-align:center}
#starPill.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
#btnParents{width:3.4em;height:3.4em;opacity:.92}
#btnParents svg{width:2em;height:2em}
#btnParents .ring{position:absolute;inset:-.3em;border-radius:50%;border:.34em solid var(--grape);clip-path:inset(0 100% 0 0);pointer-events:none}
#btnParents.hold .ring{clip-path:inset(0 0 0 0);transition:clip-path 1s linear}
#btnMusic.off svg{opacity:.35}
#goal{left:50%;top:1.5em;transform:translateX(-50%);height:3.6em;padding:0 .7em;border-radius:2em;background:#fff;box-shadow:0 .38em 0 rgba(59,42,102,.22),0 .1em .5em rgba(59,42,102,.18);display:flex;align-items:center;gap:.6em}
#goal .ic,#goal .ic2{width:2.6em;height:2.6em;display:block}
#goal .bar{width:15em;height:1.4em;border-radius:1em;background:#EEE8FA;overflow:hidden;box-shadow:inset 0 .12em .2em rgba(59,42,102,.18)}
#goal .bar i{display:block;height:100%;width:0;border-radius:1em;background:linear-gradient(#FFDB5C,#FFB81F);transition:width .6s cubic-bezier(.3,1.3,.5,1)}
#goal b{font-size:1.5em;min-width:3.2em;text-align:center}
#prompt{left:50%;top:1.2em;transform:translateX(-50%);display:flex;align-items:center;gap:.9em;background:#fff;border-radius:2.6em;padding:.55em 1.9em .55em .6em;box-shadow:0 .4em 0 rgba(59,42,102,.2),0 .2em .8em rgba(59,42,102,.2);max-width:62%;animation:dropIn .5s cubic-bezier(.3,1.4,.5,1)}
#promptText{font-size:2.2em;font-weight:600;line-height:1.1;white-space:nowrap}
#promptText b{font-weight:700;color:var(--c,var(--grape))}
#promptText .chip{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--c);vertical-align:-.04em;margin-right:.12em;box-shadow:inset 0 -.08em 0 rgba(0,0,0,.15)}
#btnHear{width:3.6em;height:3.6em;background:var(--sun);box-shadow:0 .3em 0 var(--sun-d);flex:none}
#btnHear:active{box-shadow:0 .1em 0 var(--sun-d)}
#btnHear svg{width:2.1em;height:2.1em}
@keyframes dropIn{from{transform:translate(-50%,-140%)}to{transform:translate(-50%,0)}}
#dots{left:50%;top:6.6em;transform:translateX(-50%);display:flex;gap:.5em}
#dots i{width:2.3em;height:2.3em;display:block;opacity:.95}
#dots i svg{width:100%;height:100%;display:block}
#dots i.on{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
#btnSkip{right:1.4em;bottom:1.4em}
.btn{font-size:1.7em;font-weight:700;color:#fff;padding:.5em 1.3em;border-radius:2em;background:var(--c,var(--grape));box-shadow:0 .3em 0 var(--cd,var(--grape-d)),0 .4em .8em rgba(59,42,102,.25);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:.4em;white-space:nowrap}
.btn:active{transform:translateY(.2em);box-shadow:0 .1em 0 var(--cd,var(--grape-d))}
.btn svg{width:1.4em;height:1.4em;display:block}
.btn.sun{--c:var(--sun);--cd:var(--sun-d);color:#5A3A00}
.btn.leaf{--c:var(--leaf);--cd:var(--leaf-d)}
.btn.sky{--c:var(--sky);--cd:var(--sky-d)}
.btn.berry{--c:var(--berry);--cd:var(--berry-d)}
.btn.ghost{--c:rgba(255,255,255,.92);--cd:rgba(59,42,102,.25);color:var(--ink)}
.btn.danger{--c:#fff;--cd:#F2C9CD;color:#D63A48}
#btnParty{right:.7em;bottom:.75em;transform-origin:100% 100%;--c:var(--berry);--cd:var(--berry-d);font-size:2em;animation:partyPulse 1s ease-in-out infinite}
#btnParty:active{transform:translateY(.2em)}
@keyframes partyPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* speech bubble */
#bubble{left:50%;bottom:1.3em;transform:translateX(-50%);display:flex;align-items:center;gap:0;max-width:74%;animation:bubbleIn .4s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
#bubble>*{pointer-events:auto}
#bubbleAvatar{width:7.2em;height:7.2em;flex:none;border-radius:50%;background:var(--c,#8E5CD9);border:.4em solid #fff;box-shadow:0 .35em 0 rgba(59,42,102,.2);overflow:hidden;z-index:1;margin-right:-1.6em}
#bubbleAvatar svg{display:block;width:100%;height:100%}
#bubble .bb{background:#fff;border-radius:2em;padding:.8em 1.8em .9em 2.6em;box-shadow:0 .4em 0 rgba(59,42,102,.2),0 .2em .8em rgba(59,42,102,.18);min-width:14em}
#bubbleName{display:inline-block;font-size:1.25em;font-weight:700;color:#fff;background:var(--c,#8E5CD9);padding:.08em .8em .12em;border-radius:1em;margin-bottom:.25em}
#bubbleText{margin:0;font-size:1.9em;font-weight:600;line-height:1.18}
#bubbleNext{width:3.8em;height:3.8em;margin-left:-1.2em;background:var(--leaf);box-shadow:0 .3em 0 var(--leaf-d);flex:none;animation:pulseBtn 1.2s ease-in-out infinite}
#bubbleNext svg{width:2em;height:2em}
@keyframes bubbleIn{from{transform:translateX(-50%) translateY(40%) scale(.8);opacity:0}to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#tip{left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(59,42,102,.88);color:#fff;font-size:1.5em;padding:.5em 1.1em;border-radius:1.4em;pointer-events:none}

/* title */
#titleUI{inset:0;pointer-events:none}
#titleUI>*{position:absolute;pointer-events:auto}
#logo{left:50%;top:1.2em;width:54em;max-width:92%;transform:translateX(-50%);pointer-events:none}
#logo svg{display:block;width:100%;height:auto;overflow:visible}
#logo .L{animation:logoIn .7s cubic-bezier(.3,1.5,.5,1) backwards, logoBob 3s ease-in-out infinite;animation-delay:calc(var(--i)*.07s + .2s),calc(var(--i)*.18s + 1s);transform-box:fill-box;transform-origin:50% 100%}
#logo .R{animation:logoIn .7s cubic-bezier(.3,1.5,.5,1) 1s backwards;transform-box:fill-box;transform-origin:50% 50%}
@keyframes logoIn{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
@keyframes logoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#btnPlay{right:17%;top:53%;width:15em;height:15em;margin-top:-7.5em;border-radius:50%}
#btnPlay .face{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 28%,#FFE680,#FFC93C 60%);box-shadow:0 1em 0 var(--sun-d),0 1.4em 1.6em rgba(59,42,102,.3),inset 0 -.5em 0 rgba(240,154,0,.35);border:.7em solid #fff;display:grid;place-items:center;transition:transform .08s,box-shadow .08s;animation:pulseBtn 1.4s ease-in-out infinite}
#btnPlay .face svg{width:7em;height:7em;margin-left:.9em;display:block}
#btnPlay:active .face{transform:translateY(.6em);box-shadow:0 .4em 0 var(--sun-d),inset 0 -.5em 0 rgba(240,154,0,.35);animation:none}
#btnPlay .pulse{position:absolute;inset:-.6em;border-radius:50%;border:.6em solid #fff;opacity:0;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.45);opacity:0}}

/* HUD modes */
#hud[data-mode="boot"]>*{display:none}
#hud[data-mode="title"] #btnBack,#hud[data-mode="title"] #goal,#hud[data-mode="title"] #starPill,#hud[data-mode="intro"] #btnBack,#hud[data-mode="intro"] #topRight,#hud[data-mode="intro"] #goal,
#hud[data-mode="game"] #goal,#hud[data-mode="game"] #btnParents,#hud[data-mode="game"] #btnAlbum,#hud[data-mode="party"] #goal,#hud[data-mode="party"] #btnParents,#hud[data-mode="party"] #btnAlbum,
#hud[data-mode="map"] #btnMusic{display:none}
#hud:not([data-mode="game"]) #dots{display:none}

/* modal */
#modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(48,32,90,.55);font-size:calc(var(--hs)*16px);animation:fadeIn .25s}
#modalCard{position:relative;background:var(--paper);border-radius:2.6em;padding:1.8em 2.2em 2em;width:min(46em,92%);max-height:92%;overflow:auto;text-align:center;box-shadow:0 .7em 0 rgba(59,42,102,.3),0 1.6em 3em rgba(30,20,60,.4);animation:cardIn .45s cubic-bezier(.3,1.4,.5,1);-webkit-overflow-scrolling:touch;touch-action:pan-y}
#modalCard.wide{width:min(62em,94%)}
#modalCard h2{margin:0 0 .2em;font-size:2.6em;font-weight:700;color:var(--grape)}
#modalCard p{margin:.3em 0;font-size:1.45em;font-weight:500;color:var(--ink2);line-height:1.3}
#modalCard .row{display:flex;gap:1em;justify-content:center;flex-wrap:wrap;margin-top:1.2em}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{transform:scale(.6) translateY(10%);opacity:0}to{transform:none;opacity:1}}
.stars5{display:flex;justify-content:center;gap:.4em;margin:.5em 0}
.stars5 i{width:4.6em;height:4.6em;display:block;animation:starIn .5s cubic-bezier(.3,1.7,.5,1) backwards;animation-delay:calc(var(--i)*.12s + .25s)}
.stars5 i svg{width:100%;height:100%}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.prize{display:inline-flex;flex-direction:column;align-items:center;gap:.3em;margin:.6em 0 0}
.prize .stk{width:9em;height:9em;animation:prizeIn .7s cubic-bezier(.3,1.6,.5,1) 1s backwards}
.prize span{font-size:1.4em;color:var(--ink)}
@keyframes prizeIn{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.stk{position:relative;display:block;border-radius:50%;background:var(--c,#EEE);border:.45em solid #fff;box-shadow:0 .3em 0 rgba(59,42,102,.2),0 .1em .5em rgba(59,42,102,.2)}
.stk svg{position:absolute;inset:10%;width:80%;height:80%}
.album{display:grid;grid-template-columns:repeat(6,1fr);gap:1em .8em;margin:1em 0 .2em}
.album figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:.35em}
.album .stk{width:6.2em;height:6.2em}
.album figcaption{font-size:1.02em;font-weight:600;line-height:1.1;color:var(--ink)}
.album .locked .stk{background:#ECE6F6;border-style:dashed;border-color:#CFC4E6;box-shadow:none}
.album .locked .stk svg{opacity:.35}
.album .locked figcaption{color:#A79CC4}
.parents{text-align:left}
.parents h2{text-align:center}
.parents .lead{font-size:1.3em}
.skills{display:grid;gap:.55em;margin:1em 0}
.skill{display:grid;grid-template-columns:7em 1fr 10em;align-items:center;gap:.8em;font-size:1.3em}
.skill .bar{height:1em;border-radius:1em;background:#EEE8FA;overflow:hidden}
.skill .bar i{display:block;height:100%;background:var(--c);border-radius:1em}
.skill small{font-weight:500;color:var(--ink2);text-align:right}
.toggle{display:flex;align-items:center;gap:.6em;font-size:1.4em;margin-top:.6em;cursor:pointer}
.toggle input{width:1.3em;height:1.3em;accent-color:var(--grape)}

#iris{position:absolute;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
#rotHint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;background:rgba(59,42,102,.92);color:#fff;font:600 17px var(--font);padding:10px 18px 10px 12px;border-radius:30px;display:flex;align-items:center;gap:10px;white-space:nowrap;pointer-events:none;animation:fadeIn .4s}
#rotHint .ph{width:22px;height:34px;border:3px solid #fff;border-radius:6px;display:block;animation:phone 1.8s ease-in-out infinite}
@keyframes phone{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.drift,.bob>.sp-in,.sway>.sp-in,.spin>.sp-in{animation:none}}
/* extras */
.sp{pointer-events:none}
.sp.tap .sp-in,.sp.drag .sp-in{pointer-events:auto}
.sp.drag{cursor:grab}
.twk>.sp-in{animation:twinkle 2.4s ease-in-out infinite}
.bfly .wing{animation:flap .28s ease-in-out infinite alternate}
.bfly .w2{animation-name:flap2}
@keyframes flap{0%,35%{transform:scaleX(1)}to{transform:scaleX(.42)}}
@keyframes flap2{0%,35%{transform:scaleX(1)}to{transform:scaleX(.42)}}
#hud[data-mode="game"] #bubble{bottom:auto;top:1.1em;animation-name:bubbleInTop}
#hud[data-mode="game"].talking #prompt,#hud[data-mode="game"].talking #dots{opacity:0;pointer-events:none}
@keyframes bubbleInTop{from{transform:translateX(-50%) translateY(-60%) scale(.8);opacity:0}to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
#prompt,#dots{transition:opacity .2s}
/* title logo */
.logo{display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.logo .line{display:flex;align-items:flex-end;gap:0}
.logoL{position:relative;display:inline-block;font:700 168px/1 var(--font);color:var(--c);isolation:isolate;animation:logoIn .7s cubic-bezier(.3,1.5,.5,1) backwards,logoBob 3s ease-in-out infinite;animation-delay:calc(var(--i)*.07s + .25s),calc(var(--i)*.2s + 1.2s);transform-origin:50% 100%;margin:0 -3px}
.logoL::before{content:attr(data-l);position:absolute;left:0;top:0;z-index:-1;color:#fff;-webkit-text-stroke:30px #fff;text-shadow:0 14px 0 rgba(59,42,102,.3)}
.logoL::after{content:attr(data-l);position:absolute;left:0;top:0;z-index:1;color:transparent;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 55%);-webkit-background-clip:text;background-clip:text;pointer-events:none}
.logoL.sm{font-size:110px;margin:0 22px 14px}
.logo .rib{margin-top:-6px;font:700 50px/1 var(--font);color:#fff;background:var(--grape);padding:14px 44px 18px;border-radius:44px;box-shadow:0 9px 0 var(--grape-d),0 16px 24px rgba(59,42,102,.25);border:6px solid #fff;animation:logoIn .7s cubic-bezier(.3,1.5,.5,1) 1.1s backwards;letter-spacing:.5px}
.playB{width:100%;height:100%;border-radius:50%;position:relative;display:block}
.playB .face{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 28%,#FFE680,#FFC93C 62%);box-shadow:0 18px 0 var(--sun-d),0 26px 30px rgba(59,42,102,.3),inset 0 -10px 0 rgba(240,154,0,.35);border:13px solid #fff;display:grid;place-items:center;animation:pulseBtn 1.4s ease-in-out infinite}
.playB .face svg{width:46%;height:46%;margin-left:7%;display:block;filter:drop-shadow(0 5px 0 rgba(160,96,0,.45))}
.playB .ring{position:absolute;inset:-10px;border-radius:50%;border:10px solid #fff;opacity:0;animation:ring 1.8s ease-out infinite}
.sp.tap:active .playB .face{transform:translateY(10px);box-shadow:0 8px 0 var(--sun-d),inset 0 -10px 0 rgba(240,154,0,.35);animation:none}
.tag{font:700 34px/1 var(--font);color:#fff;background:var(--c);padding:8px 22px 11px;border-radius:30px;box-shadow:0 6px 0 rgba(59,42,102,.22);border:5px solid #fff;white-space:nowrap;display:inline-block}
.sp.dim{filter:grayscale(.2) brightness(.96)}
.lit>.sp-in{animation:lit .34s ease-out}
@keyframes lit{0%{transform:scale(1);filter:brightness(1)}35%{transform:scale(1.08,1.04);filter:brightness(1.5)}100%{transform:scale(1);filter:brightness(1)}}
.jump>.sp-in{animation:jump .5s cubic-bezier(.3,.6,.4,1)}
@keyframes jump{0%,100%{transform:scale(1)}30%{transform:scale(1.1)}60%{transform:scale(.97)}}
.swim>.sp-in{animation:swim 2.6s ease-in-out infinite;animation-delay:var(--ph,0s)}
.swim .tail{animation:tail .5s ease-in-out infinite alternate}

/* ---------------- Fabi y Cami: como en la ilustración de referencia, con un atuendo para cada clima ---------------- */
// Outfits: base (templado), frio (abrigo, gorro, bufanda, botas), calor (sombrero, vestido fresco, sandalias),
// color (falda arcoíris y flores), lluvia (impermeable con capucha y botas de agua).
const OL = '#3E1E14', SW = 4.5;
const G_SKIN = '#FBB68F', G_SKIN_S = '#F09A78', G_HAIR = '#7A4129', G_HAIR_D = '#57301F', G_HAIR_L = '#9A5B3C';
const G_MOUTH = '#501421', G_TONGUE = '#EA686C', G_BLUSH = '#F87D79';
const RAINBOW = ['#FF5A65', '#FF9A3A', '#FFD23F', '#55C97A', '#4FB8F0', '#9B6BE0'];
const ol = (w = SW) => `stroke="${OL}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
// A shape is a function of its paint, so a limb can be drawn in two passes (every outline, then every fill):
// the dark line then runs around the whole limb and never cuts across the elbow or the wrist.
const sR = (x, y, w, h, r) => a => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r == null ? Math.min(w, h) / 2 : r}" ${a}/>`;
const sC = (cx, cy, r) => a => `<circle cx="${cx}" cy="${cy}" r="${r}" ${a}/>`;
const sP = d => a => `<path d="${d}" ${a}/>`;
const pass1 = parts => parts.map(p => p[0](`fill="${OL}" stroke="${OL}" stroke-width="${SW * 2}" stroke-linejoin="round"`)).join('');
const pass2 = parts => parts.map(p => p[0](`fill="${p[1]}"`) + (p[2] || '')).join('');
const armG = (dir, x, y, ey, upper, fore) => `<g class="c-arm ${dir > 0 ? 'c-armL' : 'c-armR'}" ${O(x, y)}>${pass1(upper)}<g class="c-fore" ${O(x, ey)}>${pass1(fore)}</g>${pass2(upper)}<g class="c-fore" ${O(x, ey)}>${pass2(fore)}</g></g>`;

function eyeG(cx, cy, rx, ry, out) {
  const ir = rx * .76, px = cx + out * 1.2, py = cy + 1.5, lx = cx - out * rx;
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff" ${ol(3)}/>
  <circle cx="${px}" cy="${py}" r="${ir}" fill="#2B1810"/>
  <path d="M${px - ir * .88} ${py + ir * .34}a${ir} ${ir} 0 0 0 ${ir * 1.76} 0a${ir * 1.5} ${ir * 1.5} 0 0 1 ${-ir * 1.76} 0Z" fill="#6E4024" opacity=".9"/>
  <circle cx="${px}" cy="${py}" r="${ir * .5}" fill="#0E0705"/>

// The animal friends get the same dark outline as the girls: their drawing is repeated underneath as a slightly fatter dark shape.
function outlined(a) {
  const tag = '<g class="c-all">', i = a.svg.indexOf(tag), j = a.svg.lastIndexOf('</g>');
  if (i < 0) return a;
  const inner = a.svg.slice(i + tag.length, j);
  const sil = inner.replace(/ id="/g, ' data-id="').replace(/stroke-width="([\d.]+)"/g, (m, n) => `style="stroke-width:${+n + SW * 2}px"`);
  return Object.assign({}, a, { svg: a.svg.slice(0, i + tag.length) + '<g class="sil">' + sil + '</g>' + inner + a.svg.slice(j) });
}
for (const k of ['bimba', 'tito', 'pipo', 'buho', 'lumi']) { const f = ART[k]; ART[k] = () => outlined(f()); }

/* ---------------- Isla del Desierto: Laberinto al oasis ---------------- */
function makeMaze(C, R) {
  const right = Array.from({ length: R }, () => Array(C).fill(true)), down = Array.from({ length: R }, () => Array(C).fill(true)), seen = Array.from({ length: R }, () => Array(C).fill(false));

  while (st.length) {
    const [c, r] = st[st.length - 1], nb = shuffle([[1, 0], [-1, 0], [0, 1], [0, -1]]).map(([dc, dr]) => [c + dc, r + dr]).filter(([x, y]) => x >= 0 && y >= 0 && x < C && y < R && !seen[y][x]);
    if (!nb.length) { st.pop(); continue; }
    const [x, y] = nb[0]; seen[y][x] = true;
    if (x > c) right[r][c] = false; else if (x < c) right[r][x] = false; else if (y > r) down[r][c] = false; else down[y][c] = false;
    st.push([x, y]);
  }
  const open = (c, r, x, y) => x === c + 1 ? !right[r][c] : x === c - 1 ? !right[r][x] : y === r + 1 ? !down[r][c] : y === r - 1 ? !down[y][c] : false;
  return { C, R, right, down, open };
}
function mazePath(m, a, b, maxLen = 99) {
  const prev = new Map(), key = ([c, r]) => c + ',' + r, q = [a]; prev.set(key(a), null);
  while (q.length) {
    const cur = q.shift(); if (cur[0] === b[0] && cur[1] === b[1]) break;
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = [cur[0] + dc, cur[1] + dr]; if (nx[0] < 0 || nx[1] < 0 || nx[0] >= m.C || nx[1] >= m.R || prev.has(key(nx)) || !m.open(cur[0], cur[1], nx[0], nx[1])) continue; prev.set(key(nx), cur); q.push(nx); }
  }
  if (!prev.has(key(b))) return null;
  const out = []; for (let p = b; p; p = prev.get(key(p))) out.unshift(p);
  return out.length - 1 <= maxLen ? out : null;
}
PROP.maze = (m, cs) => {

    if (y < m.R - 1 && m.down[y][x]) walls += `M${x * cs} ${(y + 1) * cs}H${(x + 1) * cs}`;
    if (r() < .35) deco += `<circle cx="${x * cs + r() * cs * .8 + cs * .1}" cy="${y * cs + r() * cs * .8 + cs * .1}" r="${3 + r() * 4}" fill="#E9C27E"/>`;
  }
  return `<svg viewBox="-30 -30 ${W + 60} ${H + 60}" xmlns="http://www.w3.org/2000/svg"><rect x="-26" y="-18" width="${W + 52}" height="${H + 52}" rx="40" fill="#C98A4B"/><rect x="-26" y="-26" width="${W + 52}" height="${H + 52}" rx="40" fill="#E8B46A"/><rect x="-8" y="-8" width="${W + 16}" height="${H + 16}" rx="24" fill="#FCE7B8"/>${deco}

    const r = resolve; resolve = null;

    await clearAll([gl, card]); bl.inn.innerHTML = PROP.blender(null, 0); r();

    const home = shuffle([[990, 300], [1160, 330], [990, 540], [1150, 580], [380, 790], [880, 790]]);
    let left = gx * gy; const pcs = [];

    for (let r = 0; r < gy; r++) for (let c = 0; c < gx; c++) {

    say('fabi', '¡Buenos días, Pelusa!');
  });
  const ward = sprite(PROP.petBtn('ropa'), X0, YS[4], { w: 132, h: 132, anchor: 'center', z: 700, cls: 'pop' });
  ownTap(ward, () => {
    const open = PET_ACC.map((a, i) => i).filter(i => save.stickers.length >= PET_ACC[i][1]);
    p.acc = open[(open.indexOf(p.acc) + 1) % open.length]; persist(); drawn = ''; draw(); pet.anim('jump', 500); sparkle(pet.x, pet.y - 300 * size, 12); Snd.pop();
    if (p.acc) say('fabi', '¡Qué bonita se ve!');
  });
  // testing hook: the next useful thing to do
  s.bot = () => p.food < 3 && p.treats > 0 && !food.busy ? [food.x, food.y, pet.x, pet.y - 160 * size] : null;
  // greeting: the friend says what Pelusa needs most
  s.after(.8, () => {
    SFX.play(petNeeds() ? 'miau2' : 'miau');
    const need = ['food', 'clean', 'fun'].reduce((a, k) => p[k] < p[a] ? k : a, 'food');
    const line = firstTime ? '¡Mira, es Pelusa, nuestra gatita!' : p[need] >= 3 ? '¡Pelusa está muy feliz!'
      : { food: 'Pelusa tiene hambre. ¡Dale de comer!', clean: 'Pelusa está sucia. ¡Vamos a bañarla!', fun: 'Pelusa quiere jugar. ¡Tírale la pelota!' }[need];
    const d = say('fabi', line); duo.F.wave();
    if (firstTime) s.after(d + .2, () => say('fabi', { food: 'Pelusa tiene hambre. ¡Dale de comer!', clean: 'Pelusa está sucia. ¡Vamos a bañarla!', fun: 'Pelusa quiere jugar. ¡Tírale la pelota!' }[need]));
    else s.after(d + .2, () => say('vale', pick(['¡Michi!', '¡Miau!']), { quiet: true }));
  });
};

  ownTap(pet, () => { if (going) return; SFX.play('miau'); pet.anim('jump', 500); s.after(.35, () => go('mascota')); });

}; }
{ const f = SCENES.mundo; SCENES.mundo = arg => { f(arg); const s = S; if (!s || !petNeeds()) return;
